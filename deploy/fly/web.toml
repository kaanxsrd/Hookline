# Hookline web app on Fly.io (see docs/deployment.md#flyio).
#   fly deploy --config deploy/fly/web.toml --app <your web app>
app = "hookline-web"
primary_region = "fra"

[build]
  image = "ghcr.io/kaanxsrd/hookline-web:latest"

[env]
  LOG_FORMAT = "json"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/readyz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
