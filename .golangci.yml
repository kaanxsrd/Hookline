version: "2"

run:
  # CI lints five modules in parallel with the tests on two cores; cold caches are slow.
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming
    sloglint:
      kv-only: false
      no-global: all
      context: scope
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
    paths:
      - tmp

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kaanxsrd/hookline
  exclusions:
    paths:
      - tmp
