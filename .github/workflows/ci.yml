name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TypeScript database tests use this server; Go tests start their own
    # PostgreSQL through testcontainers.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: hookline
          POSTGRES_PASSWORD: hookline
          POSTGRES_DB: hookline
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hookline -d hookline"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://hookline:hookline@localhost:5433/hookline
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Cache pinned Go tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('tools/go.sum') }}

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Biome, tsc, golangci-lint, Go tests (with -race; gcc ships with the runner) and Vitest.
      - run: bun run check

      - run: bun run build

      - name: Regenerate derived code (sqlc) and check the Drizzle snapshot
        run: |
          bun run gen
          bun run db:generate

      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'bun run gen' and 'bun run db:generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up minio-init

      - run: bun install --frozen-lockfile

      - run: bun run db:migrate

      - run: bun run build

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # CI=true makes Playwright start `next start` and the edge itself.
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
