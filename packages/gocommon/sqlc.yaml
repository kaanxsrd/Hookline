# sqlc reads the migrations owned by packages/db (Drizzle) and generates the
# Go query layer in ./dbq. Run `bun run gen` from the repository root.
version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: dbq/queries
    gen:
      go:
        package: dbq
        out: dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: pg_catalog.date
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
